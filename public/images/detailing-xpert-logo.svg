<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 88" fill="none">
  <defs>
    <!-- Metallic Blue Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80C4FF"/>
      <stop offset="45%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#0066E6"/>
    </linearGradient>
    <linearGradient id="blueGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066E6" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Metallic Chrome / Silver Gradients -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E5E7EB"/>
      <stop offset="70%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171F"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem Group -->
  <g transform="translate(8, 8)">
    <!-- Outer Shield Frame -->
    <path d="M36 4 L66 15 V38 C66 56 53 67 36 72 C19 67 6 56 6 38 V15 Z" 
          fill="url(#badgeBg)" 
          stroke="url(#chromeGrad)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>
    
    <!-- Inner Accent Rim -->
    <path d="M36 8 L61 17 V37 C61 52 50 62 36 66 C22 62 11 52 11 37 V17 Z" 
          fill="none" 
          stroke="url(#blueGrad)" 
          stroke-width="1.2" 
          stroke-opacity="0.8"/>

    <!-- Dynamic Automotive 'X' Symbol -->
    <!-- Arm 1: Silver / Chrome Slash -->
    <path d="M23 24 L49 52 H42 L16 24 Z" fill="url(#chromeGrad)"/>
    <!-- Arm 2: Electric Blue Slash with Soft Glow -->
    <path d="M49 24 L23 52 H30 L56 24 Z" fill="url(#blueGrad)" filter="url(#softGlow)"/>
    
    <!-- Center Speed Diamond -->
    <polygon points="36,34 40,38 36,42 32,38" fill="#FFFFFF"/>
    
    <!-- Micro Horizontal Speed Lines -->
    <line x1="0" y1="38" x2="4" y2="38" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="38" x2="72" y2="38" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typographic Wordmark -->
  <!-- Main Brand Title: DETAILING XPERT with tspan to ensure seamless typography -->
  <g transform="translate(94, 14)">
    <text x="0" y="34" 
          font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="30" 
          font-weight="900" 
          letter-spacing="0.05em">
      <tspan fill="url(#chromeGrad)">DETAILING </tspan>
      <tspan fill="url(#blueGrad)" filter="url(#softGlow)">X</tspan>
      <tspan fill="url(#chromeGrad)">PERT</tspan>
    </text>

    <!-- Horizontal Divider with Electric Blue Horizon Accent -->
    <line x1="0" y1="46" x2="310" y2="46" stroke="#1F242F" stroke-width="1.2"/>
    <line x1="0" y1="46" x2="75" y2="46" stroke="url(#blueGrad)" stroke-width="2"/>

    <!-- Subtitle: JAIPUR • AUTOMOTIVE STUDIO -->
    <text x="1" y="61" 
          font-family="'Space Grotesk', 'Inter', monospace" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="0.28em" 
          fill="#94A3B8">
      JAIPUR • AUTOMOTIVE STUDIO
    </text>
  </g>
</svg>
