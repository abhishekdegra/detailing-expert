<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70B8FF"/>
      <stop offset="50%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#0066E6"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171F"/>
      <stop offset="100%" stop-color="#08090A"/>
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="#08090A"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#silverGrad)" stroke-width="1.2" stroke-opacity="0.3"/>
  
  <!-- Modern Geometric Shield -->
  <path d="M32 8 L50 16 V30 C50 42 42 50.5 32 55 C22 50.5 14 42 14 30 V16 Z" fill="url(#shieldBg)" stroke="url(#blueGrad)" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Stylized Automotive 'X' Emblem -->
  <!-- Left-to-right diagonal arm -->
  <path d="M22 22 L42 42 H37 L17 22 Z" fill="url(#silverGrad)"/>
  <!-- Right-to-left diagonal arm with electric blue break -->
  <path d="M42 22 L22 42 H27 L47 22 Z" fill="url(#blueGrad)" filter="url(#blueGlow)"/>
  <!-- Center Core Speed Notch -->
  <polygon points="32,28 35,32 32,36 29,32" fill="#FFFFFF"/>
</svg>